rules:
  - id: hardcoded-secret-key
    languages: [python]
    severity: ERROR
    message: >-
      The Flask secret key is a string literal in source code. Anyone with
      the repo can forge sessions. Load it from the environment or a secret store.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
    pattern-either:
      - pattern: $APP.config["SECRET_KEY"] = "..."
      - pattern: $APP.secret_key = "..."
      - pattern: $APP.config.update(..., SECRET_KEY="...", ...)
      - pattern: '$APP.config.update({..., "SECRET_KEY": "...", ...})'
      - pattern: $APP.config.from_mapping(..., SECRET_KEY="...", ...)
