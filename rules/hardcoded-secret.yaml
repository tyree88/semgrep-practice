rules:
  - id: hardcoded-secret
    # Simplest kind of rule: one pattern. "..." matches any string.
    pattern: $APP.config["SECRET_KEY"] = "..."
    message: The secret key is written in the code. Load it from an environment variable instead.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
