rules:
  - id: weak-hash
    languages: [python]
    severity: WARNING
    message: >-
      MD5 and SHA-1 are broken for security use. For passwords use
      hashlib.scrypt or argon2; for integrity use SHA-256. If this is not a
      security use, pass usedforsecurity=False.
    metadata:
      category: security
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("=~/^(md5|sha1)$/i", ...)
      - pattern-not: hashlib.$F(..., usedforsecurity=False, ...)
