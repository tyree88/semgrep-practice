rules:
  - id: flask-command-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Flask request data reaches a shell command. Pass an argument list
      without shell=True, and validate the input.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
    pattern-sources:
      - pattern: flask.request.$ANY
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: subprocess.$FUNC($CMD, ..., shell=True, ...)
              - pattern-inside: os.system($CMD)
              - pattern-inside: os.popen($CMD, ...)
          - focus-metavariable: $CMD
