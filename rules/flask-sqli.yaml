rules:
  - id: flask-sqli
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Flask request data flows into the SQL text passed to `$CUR.execute()`.
      Pass user input as bound parameters: execute("... WHERE x = ?", (value,)).
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
    pattern-sources:
      - pattern: flask.request.$ANY
    pattern-sinks:
      # Only the query text is a sink; the parameters tuple is the safe channel.
      - patterns:
          - pattern-inside: $CUR.$EXEC($QUERY, ...)
          - metavariable-regex:
              metavariable: $EXEC
              regex: ^(execute|executemany|executescript)$
          - focus-metavariable: $QUERY
