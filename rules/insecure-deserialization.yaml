rules:
  - id: insecure-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      This deserializer can run code from crafted input. Use json, or
      yaml.safe_load(), for data you do not fully trust.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: MEDIUM
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.unsafe_load_all(...)
      - patterns:
          - pattern: yaml.$LOAD(...)
          - metavariable-regex:
              metavariable: $LOAD
              regex: ^(load|load_all)$
          # Loader may be passed by keyword or by position.
          - pattern-not: yaml.$LOAD(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.$LOAD($DATA, yaml.SafeLoader)
          - pattern-not: yaml.$LOAD(..., Loader=yaml.CSafeLoader, ...)
          - pattern-not: yaml.$LOAD($DATA, yaml.CSafeLoader)
          - pattern-not: yaml.$LOAD(..., Loader=yaml.BaseLoader, ...)
          - pattern-not: yaml.$LOAD($DATA, yaml.BaseLoader)
          - pattern-not: yaml.$LOAD(..., Loader=yaml.CBaseLoader, ...)
          - pattern-not: yaml.$LOAD($DATA, yaml.CBaseLoader)
