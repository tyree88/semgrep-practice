rules:
  - id: flask-debug-enabled
    languages: [python]
    severity: WARNING
    message: >-
      Flask debug mode exposes the Werkzeug debugger, which allows remote
      code execution. Control it with an environment variable that is off by default.
    metadata:
      category: security
      cwe: "CWE-489: Active Debug Code"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: HIGH
    pattern: $APP.run(..., debug=True, ...)
