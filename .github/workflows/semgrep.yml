name: semgrep

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v5

      # 1. Check the rules work: each rules/<id>.py marks what must (ruleid) and must not (ok) match.
      - name: Test the rules
        run: semgrep --test rules/

      # 2. Scan the app with our rules. Findings show in the log.
      #    Add --error to make the job fail when Semgrep finds something.
      - name: Scan the app
        run: semgrep scan --config rules/ app.py --metrics=off
